services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football_edge
    # Sin mapeo de puerto a host a proposito: solo `backend`/`scheduler` lo
    # usan, y lo hacen dentro de la red interna de Docker (host `postgres`,
    # puerto 5432 "de contenedor a contenedor", nunca expuesto en tu
    # maquina). Evita el choque tipico con un Postgres del sistema o de
    # otro proyecto ya escuchando en localhost:5432. Si necesitas conectar
    # un cliente SQL desde fuera de Docker para depurar, anhade
    # temporalmente `ports: ["5433:5432"]` (puerto distinto en el host).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Sin esto, el backend NUNCA ve tu .env: pydantic-settings busca
    # '/srv/.env' DENTRO del contenedor (ver backend/app/config/settings.py),
    # y el Dockerfile no copia tu .env real a proposito (secreto, no va en
    # la imagen). `env_file` hace que Compose inyecte cada variable de tu
    # .env del HOST como variable de entorno del contenedor -- asi
    # ODDS_API_KEY/API_FOOTBALL_KEY/etc. llegan sin tener que montar el
    # fichero ni tocar el Dockerfile. `required: false`: si aun no has
    # hecho 'cp .env.example .env', arranca igual (sin esas claves) en vez
    # de fallar todo el 'docker compose up'.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://football:football@postgres:5432/football_edge
      APP_ENV: production
      LOG_LEVEL: INFO
    # Puerto configurable: si el 8000 del host ya esta ocupado (p.ej. un
    # 'uvicorn' suelto de una prueba anterior), pon BACKEND_PORT=8001 (o el
    # que sea) en tu .env -- sin tocar este fichero. docker compose lee
    # ese .env automaticamente para sustituir variables aqui.
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/srv/models
      - ./data:/srv/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # OJO: esto se hornea DENTRO del build del frontend (Next.js lee
        # NEXT_PUBLIC_* en tiempo de compilacion, no de arranque) -- si
        # cambias BACKEND_PORT arriba, pon aqui el MISMO puerto
        # (NEXT_PUBLIC_API_URL=http://localhost:<BACKEND_PORT> en tu .env)
        # y reconstruye con 'docker compose build frontend'.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      # Variable de ENTORNO (no de build, se lee en caliente): la usan las
      # paginas que renderiza el propio contenedor del frontend
      # (lib/api.ts::resolveApiUrl) para llegar al backend por la red
      # INTERNA de Docker Compose ("backend" es el nombre del servicio de
      # arriba, resoluble solo dentro de esa red). Sin esto, esas paginas
      # intentarian "localhost:8000", que dentro de este contenedor es el
      # propio frontend, no el backend -- de ahi el "No se pudo conectar
      # con la API" aunque el backend estuviera sano.
      API_URL: http://backend:8000
      # La usa frontend/app/api/agent/chat/route.ts, un proxy SERVER-SIDE
      # hacia POST /agent/chat del backend: asi el secreto nunca se manda
      # como NEXT_PUBLIC_* (lo que lo haria visible en el navegador de
      # cualquiera que abra las herramientas de desarrollador). Mismo
      # valor que AGENT_SHARED_SECRET del backend -- si no coincide, el
      # backend respondera 401 a las peticiones de Jarvis.
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:-}
    # Mismo mecanismo que el backend: FRONTEND_PORT en tu .env si el 3000
    # tambien estuviera ocupado.
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # Refresca fixtures/cuotas/predicciones y liquida (settle) los partidos
  # que hayan terminado cada hora -- ver docs/data_sources.md#refresco-horario.
  # Reusa la MISMA imagen que `backend` (mismo codigo, mismas dependencias),
  # solo cambia el comando: en vez de sevir la API, corre en bucle
  # `football-edge refresh --skip-historical`. `--skip-historical` se salta
  # la descarga de resultados de temporadas pasadas (pesada, no cambia hora
  # a hora); el resto de pasos (fixtures, cuotas, evaluate/settle,
  # predicciones) SI conviene repetirlos cada hora. Un fallo puntual (p.ej.
  # una API externa caida un rato) no debe tumbar el contenedor: `|| true`
  # deja que el bucle siga y lo reintente en la siguiente vuelta.
  scheduler:
    # Desactiva el HEALTHCHECK heredado del Dockerfile de `backend` (hace
    # 'curl http://localhost:8000/health', pensado para el servidor web).
    # Este contenedor no sirve nada en el 8000 -- solo corre el bucle de
    # refresh -- asi que ese healthcheck fallaria siempre y marcaria el
    # contenedor como "unhealthy" aunque funcione perfectamente.
    healthcheck:
      disable: true
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Mismo motivo que en `backend`: sin esto, 'football-edge refresh' aqui
    # dentro tampoco veria tu .env y se saltaria cuotas/entrenamiento real.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://football:football@postgres:5432/football_edge
      APP_ENV: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/srv/models
      - ./data:/srv/data
    entrypoint: ["/bin/sh", "-c"]
    # NO usa 'football-edge refresh' entero cada hora a proposito: ese
    # comando incluye update-odds/update-secondary-odds (llaman a APIs
    # externas con cuota LIMITADA -- The Odds API free tier = 500
    # peticiones/mes). Pedir cuotas cada hora para 5 ligas agota esa cuota
    # en menos de una semana (500 / 5 ligas / 24h ~= 4 dias), sin ninguna
    # ganancia real: las cuotas de mercado no cambian tan rapido como para
    # necesitar refresco horario. Lo que SI necesita ser horario es lo que
    # no gasta cuota externa: traer fixtures nuevos y liquidar
    # (evaluate/settle) los partidos que hayan terminado, para que
    # Historico se actualice casi en tiempo real. Las cuotas se piden solo
    # 4 veces al dia (horas 0/6/12/18 UTC) -- suficiente para que "Mejores
    # senhales" no se quede con cuotas muy desactualizadas, sin quemar la
    # cuota mensual gratuita.
    # IMPORTANTE: todo "$" de este script va escapado como "$$" a
    # proposito. Docker Compose interpola SU PROPIA sintaxis de variables
    # ($VAR, ${VAR}, ${VAR:-default}...) en cualquier valor del YAML antes
    # de que el contenedor vea el comando -- bug real detectado en
    # produccion: "$hour" se sustituia por el valor (vacio) de una
    # variable de entorno del HOST llamada "hour" (de ahi el aviso "The
    # 'hour' variable is not set" en TODOS los comandos de compose, no
    # solo al arrancar este servicio), dejando literalmente "10# % 6" y
    # tumbando el contenedor entero (exit code 2) en cada pasada -- el
    # scheduler llevaba dias sin ejecutar nada. "$$" le dice a Compose "no
    # interpoles esto, es literal", y el shell del contenedor lo recibe
    # como un "$" normal.
    command:
      - >
        while true; do
          hour=$$(date -u +%H);
          hour=$${hour#0};
          hour=$${hour:-0};
          echo "[scheduler] $$(date -u +%FT%TZ) -- fixtures + liquidacion de partidos terminados + predicciones";
          football-edge update-fixtures || echo "[scheduler] fallo update-fixtures, se reintenta en 1h";
          if [ $$((hour % 6)) -eq 0 ]; then
            # 'update-fixtures' (arriba) NUNCA trae resultados: descarta a
            # proposito los partidos ya jugados de su propia fuente (ver
            # docs/data_sources.md). 'update' es el UNICO comando que
            # descarga resultados reales y marca un partido como
            # 'finished' -- sin esto en el scheduler, Historico se queda
            # parado indefinidamente por mucho que 'evaluate' corra cada
            # hora (bug real: se quedo sin avanzar semanas porque este
            # paso faltaba). Cada 6h (no cada hora) porque redescarga un
            # CSV de ~45MB del mirror de GitHub -- sin limite de cuota
            # como las APIs de cuotas, pero sin necesidad de hacerlo mas a
            # menudo (los resultados de una jornada no cambian cada hora).
            echo "[scheduler] $$(date -u +%FT%TZ) -- resultados reales + cuotas de mercado (cada 6h)";
            football-edge update || echo "[scheduler] fallo update (resultados reales), se reintenta en 6h";
            football-edge update-odds || echo "[scheduler] fallo update-odds, se reintenta en 6h";
            football-edge update-secondary-odds || echo "[scheduler] fallo update-secondary-odds, se reintenta en 6h";
            # Cierra el ciclo "el modelo aprende de sus propios fallos"
            # (pedido real de usuario): 'train' reentrena desde cero
            # leyendo TODOS los resultados reales ya en la BD, incluidos
            # los que 'update' acaba de traer -- sin esto en el scheduler,
            # el ciclo se quedaba a medias: Historico/evaluate SI reflejaban
            # los aciertos/fallos, pero ningun modelo nuevo volvia a
            # entrenarse con ellos salvo que alguien ejecutase 'train' a
            # mano (docs/modeling.md, seccion "Cerrar el ciclo"). Cada 6h
            # (no cada hora) porque reentrenar las 5 ligas no es gratis en
            # CPU y los resultados no cambian tan rapido como para
            # necesitarlo mas a menudo.
            football-edge train || echo "[scheduler] fallo train (reentrenamiento), se reintenta en 6h";
          fi
          football-edge evaluate || echo "[scheduler] fallo evaluate/settle, se reintenta en 1h";
          football-edge predict-upcoming || echo "[scheduler] fallo predict-upcoming, se reintenta en 1h";
          sleep 3600;
        done

volumes:
  postgres_data:
