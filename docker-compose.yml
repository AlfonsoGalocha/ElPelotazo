services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football_edge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://football:football@postgres:5432/football_edge
      APP_ENV: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/srv/models
      - ./data:/srv/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Refresca fixtures/cuotas/predicciones y liquida (settle) los partidos
  # que hayan terminado cada hora -- ver docs/data_sources.md#refresco-horario.
  # Reusa la MISMA imagen que `backend` (mismo codigo, mismas dependencias),
  # solo cambia el comando: en vez de sevir la API, corre en bucle
  # `football-edge refresh --skip-historical`. `--skip-historical` se salta
  # la descarga de resultados de temporadas pasadas (pesada, no cambia hora
  # a hora); el resto de pasos (fixtures, cuotas, evaluate/settle,
  # predicciones) SI conviene repetirlos cada hora. Un fallo puntual (p.ej.
  # una API externa caida un rato) no debe tumbar el contenedor: `|| true`
  # deja que el bucle siga y lo reintente en la siguiente vuelta.
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://football:football@postgres:5432/football_edge
      APP_ENV: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/srv/models
      - ./data:/srv/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          echo "[scheduler] $(date -u +%FT%TZ) -- football-edge refresh --skip-historical";
          football-edge refresh --skip-historical || echo "[scheduler] fallo esta vuelta, se reintenta en 1h";
          sleep 3600;
        done

volumes:
  postgres_data:
