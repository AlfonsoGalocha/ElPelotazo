services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football_edge
    # Sin mapeo de puerto a host a proposito: solo `backend`/`scheduler` lo
    # usan, y lo hacen dentro de la red interna de Docker (host `postgres`,
    # puerto 5432 "de contenedor a contenedor", nunca expuesto en tu
    # maquina). Evita el choque tipico con un Postgres del sistema o de
    # otro proyecto ya escuchando en localhost:5432. Si necesitas conectar
    # un cliente SQL desde fuera de Docker para depurar, anhade
    # temporalmente `ports: ["5433:5432"]` (puerto distinto en el host).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Sin esto, el backend NUNCA ve tu .env: pydantic-settings busca
    # '/srv/.env' DENTRO del contenedor (ver backend/app/config/settings.py),
    # y el Dockerfile no copia tu .env real a proposito (secreto, no va en
    # la imagen). `env_file` hace que Compose inyecte cada variable de tu
    # .env del HOST como variable de entorno del contenedor -- asi
    # ODDS_API_KEY/API_FOOTBALL_KEY/etc. llegan sin tener que montar el
    # fichero ni tocar el Dockerfile. `required: false`: si aun no has
    # hecho 'cp .env.example .env', arranca igual (sin esas claves) en vez
    # de fallar todo el 'docker compose up'.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://football:football@postgres:5432/football_edge
      APP_ENV: production
      LOG_LEVEL: INFO
    # Puerto configurable: si el 8000 del host ya esta ocupado (p.ej. un
    # 'uvicorn' suelto de una prueba anterior), pon BACKEND_PORT=8001 (o el
    # que sea) en tu .env -- sin tocar este fichero. docker compose lee
    # ese .env automaticamente para sustituir variables aqui.
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/srv/models
      - ./data:/srv/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # OJO: esto se hornea DENTRO del build del frontend (Next.js lee
        # NEXT_PUBLIC_* en tiempo de compilacion, no de arranque) -- si
        # cambias BACKEND_PORT arriba, pon aqui el MISMO puerto
        # (NEXT_PUBLIC_API_URL=http://localhost:<BACKEND_PORT> en tu .env)
        # y reconstruye con 'docker compose build frontend'.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      # Variable de ENTORNO (no de build, se lee en caliente): la usan las
      # paginas que renderiza el propio contenedor del frontend
      # (lib/api.ts::resolveApiUrl) para llegar al backend por la red
      # INTERNA de Docker Compose ("backend" es el nombre del servicio de
      # arriba, resoluble solo dentro de esa red). Sin esto, esas paginas
      # intentarian "localhost:8000", que dentro de este contenedor es el
      # propio frontend, no el backend -- de ahi el "No se pudo conectar
      # con la API" aunque el backend estuviera sano.
      API_URL: http://backend:8000
    # Mismo mecanismo que el backend: FRONTEND_PORT en tu .env si el 3000
    # tambien estuviera ocupado.
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # Refresca fixtures/cuotas/predicciones y liquida (settle) los partidos
  # que hayan terminado cada hora -- ver docs/data_sources.md#refresco-horario.
  # Reusa la MISMA imagen que `backend` (mismo codigo, mismas dependencias),
  # solo cambia el comando: en vez de sevir la API, corre en bucle
  # `football-edge refresh --skip-historical`. `--skip-historical` se salta
  # la descarga de resultados de temporadas pasadas (pesada, no cambia hora
  # a hora); el resto de pasos (fixtures, cuotas, evaluate/settle,
  # predicciones) SI conviene repetirlos cada hora. Un fallo puntual (p.ej.
  # una API externa caida un rato) no debe tumbar el contenedor: `|| true`
  # deja que el bucle siga y lo reintente en la siguiente vuelta.
  scheduler:
    # Desactiva el HEALTHCHECK heredado del Dockerfile de `backend` (hace
    # 'curl http://localhost:8000/health', pensado para el servidor web).
    # Este contenedor no sirve nada en el 8000 -- solo corre el bucle de
    # refresh -- asi que ese healthcheck fallaria siempre y marcaria el
    # contenedor como "unhealthy" aunque funcione perfectamente.
    healthcheck:
      disable: true
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Mismo motivo que en `backend`: sin esto, 'football-edge refresh' aqui
    # dentro tampoco veria tu .env y se saltaria cuotas/entrenamiento real.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://football:football@postgres:5432/football_edge
      APP_ENV: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/srv/models
      - ./data:/srv/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          echo "[scheduler] $(date -u +%FT%TZ) -- football-edge refresh --skip-historical";
          football-edge refresh --skip-historical || echo "[scheduler] fallo esta vuelta, se reintenta en 1h";
          sleep 3600;
        done

volumes:
  postgres_data:
